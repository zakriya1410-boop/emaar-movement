<script>
var EXEC="https://emaar-movement.zakriya1410.workers.dev/exec";
var q=location.search.slice(1);
try{if(/(^|&)(k|cap|c|co|s|h|fn)=/.test(q))localStorage.setItem("emq",q);else q=localStorage.getItem("emq")||"";}catch(e){}
if(q&&!location.search){try{history.replaceState(null,"","?"+q)}catch(e){}}
var MOVED=/github\.io$/.test(location.hostname);if(MOVED)location.replace("https://app.emaarharaka.com/"+(q?"?"+q:""));
function fail(m,e){try{document.getElementById("er").textContent=e?String(e&&e.message||e):"";var f=document.getElementById("fb");if(q){f.href=EXEC+"?"+q;f.hidden=false}}catch(x){}document.getElementById("st").textContent=m;document.getElementById("ld").hidden=true;document.getElementById("rt").hidden=false}

var tries=0;
function go(){
 if(!q){document.getElementById("st").textContent="أول مرة فقط: الصق رابطك الخاص المرسل من إدارة الحركة ثم اضغط دخول";document.getElementById("ld").hidden=true;document.getElementById("ln").hidden=false;return}
 if(!tries)document.getElementById("st").textContent="جارِ التحميل…";document.getElementById("ld").hidden=false;document.getElementById("rt").hidden=true;
 var done=false,C=[],started=0,failed=0,lastE=null,tm,t2;
 function end(){clearTimeout(tm);clearTimeout(t2);C.forEach(function(c){try{c&&c.abort()}catch(x){}})}
 function bad(e){if(done)return;lastE=e;failed++;if(started<2){clearTimeout(t2);one();return}if(failed>=started){done=true;end();if(++tries<4){document.getElementById("st").textContent="جارِ إعادة المحاولة… ("+tries+")";setTimeout(go,1500);return}tries=0;fail("تعذّر الاتصال – تأكد من الإنترنت ثم اضغط إعادة المحاولة",lastE)}}
 function one(){started++;var ac=window.AbortController?new AbortController():null;C.push(ac);
  fetch(EXEC+"?raw=1&"+q+(started>1?"&_r="+Date.now():""),{redirect:"follow",credentials:"omit",cache:"no-store",signal:ac?ac.signal:undefined}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(h){
   if(done)return;if(!/<html/i.test(h))throw new Error("bad response");done=true;end();document.open();document.write(h);document.close();
  }).catch(bad)}
 one();t2=setTimeout(function(){if(!done&&started<2)one()},8000);tm=setTimeout(function(){if(!done)end()},25000);
}
